<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Advanced Facade — Project Overview</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1419'/%3E%3Cpath d='M14 46V18h12v28zM32 46V26h18v20z' fill='%234493f8'/%3E%3C/svg%3E">
<style>
  /* Palette and type are the tracker's, token for token — see index.html in any
     tracker repo. Dark is the default; body.day-mode is the light theme, same
     class name and same toggle affordance as the trackers. */
  :root {
    --bg: #0f1419;
    --panel: #1a2028;
    --panel-2: #232b36;
    --border: #2d3744;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #4493f8;
    --accent-2: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
    --orange: #ff8c42;
  }
  body.day-mode {
    --bg: #f2f4f7;
    --panel: #ffffff;
    --panel-2: #e9edf2;
    --border: #d0d7de;
    --text: #1f2328;
    --text-dim: #59636e;
    --accent: #0969da;
    --accent-2: #218bff;
    --green: #1a7f37;
    --yellow: #9a6700;
    --red: #cf222e;
    --purple: #8250df;
    --orange: #bc4c00;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* The browser's own sheet says [hidden]{display:none}, but that is a plain
     attribute selector and ANY class that sets display outranks it. .veil below
     sets display:flex, so `acctPanel.hidden = true` set the attribute and changed
     nothing — the account dialog rendered over the sign-in screen from first paint
     and Cancel / Esc / backdrop all "worked" while the box stayed put. Win the
     cascade back once, here, for every element that will ever carry [hidden]. */
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: linear-gradient(135deg, #1a2028 0%, #232b36 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(10px);
  }
  body.day-mode header { background: linear-gradient(135deg, #ffffff 0%, #e9edf2 100%); }
  .header-inner { display: flex; align-items: center; justify-content: space-between;
                  gap: 20px; flex-wrap: wrap; max-width: 1600px; margin: 0 auto; }
  .header-title h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .header-title p  { font-size: 13px; color: var(--text-dim); margin: 0; }
  .header-actions { display: flex; align-items: center; gap: 8px; }

  .btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 6px; cursor: pointer;
    font-size: 13px; font-weight: 500; font-family: inherit; transition: all .15s;
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
  }
  .btn:hover { background: #2d3744; border-color: #4d5764; }
  body.day-mode .btn:hover { background: #dde3ea; border-color: #b6c0cb; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-2); border-color: var(--accent-2); }

  main { max-width: 1000px; margin: 0 auto; padding: 24px 32px 48px; }

  .section {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 22px 16px; margin-bottom: 14px; cursor: pointer; transition: border-color .15s;
  }
  .section:hover { border-color: #3d4a5a; }
  body.day-mode .section:hover { border-color: #b6c0cb; }
  .section.open { border-color: var(--accent); }
  .section.offline { opacity: .6; }
  .section.offline .bar i { background: var(--text-dim); }

  .row1 { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .name { font-size: 17px; font-weight: 600; flex: 1; min-width: 0;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: 11px; color: var(--text-dim); border: 1px solid var(--border);
         border-radius: 5px; padding: 2px 7px; white-space: nowrap; flex: none; }
  .chip { font-size: 11px; font-weight: 600; border-radius: 5px; padding: 3px 8px; white-space: nowrap; }
  .chip.dmg  { background: rgba(248,81,73,.16);  color: var(--red); }
  .chip.co   { background: rgba(188,140,255,.16); color: var(--purple); }
  .chip.idle { background: rgba(210,153,34,.16);  color: var(--yellow); }
  .open-btn { flex: none; font-size: 12px; padding: 6px 11px; }

  .bar { height: 8px; background: var(--panel-2); border: 1px solid var(--border);
         border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
  .bar i { display: block; height: 100%; background: var(--accent);
           transition: width .5s cubic-bezier(.2,.7,.3,1); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat .k { font-size: 10.5px; color: var(--text-dim); letter-spacing: .04em;
             text-transform: uppercase; margin-bottom: 3px; }
  .stat .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .v small { font-size: 12px; font-weight: 500; color: var(--text-dim); margin-left: 4px; }
  .stat.eta .v { color: var(--accent-2); }
  .stat.eta.late .v { color: var(--yellow); }
  .stat.eta.none .v { color: var(--text-dim); font-size: 15px; }

  /* Per-scope split. One measure (percent complete), so ONE hue — a categorical
     palette here would imply the scopes are unrelated series, which they are not.
     Identity is carried by the direct label on every row, never by colour. */
  .scopes { display: grid; grid-template-columns: minmax(0,auto) 1fr max-content;
            gap: 5px 12px; align-items: center; margin-top: 14px;
            padding-top: 12px; border-top: 1px solid var(--border); }
  .sname { font-size: 12.5px; color: var(--text-dim); white-space: nowrap;
           overflow: hidden; text-overflow: ellipsis; }
  .sbar  { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
  .sbar i { display: block; height: 100%; background: var(--accent); opacity: .75;
            border-radius: 0 3px 3px 0; transition: width .5s cubic-bezier(.2,.7,.3,1); }
  .sbar i.done { opacity: 1; background: var(--green); }
  .sval  { font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sval small { color: var(--text-dim); font-size: 11px; }

  /* Portfolio comparison. Horizontal bars: magnitude across a handful of named
     entities, sorted, zero baseline, every bar direct-labelled (n=3, so labelling
     all of them IS the point rather than clutter). A project with no report is
     grey and says so in words — never colour alone. */
  .chart { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
           padding: 16px 22px 18px; margin-bottom: 14px; }
  .chart h2 { margin: 0 0 14px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
              text-transform: uppercase; color: var(--text-dim); }
  .crows { display: grid; grid-template-columns: minmax(0,auto) 1fr max-content;
           gap: 9px 14px; align-items: center; }
  .cname { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cbar  { height: 10px; background: var(--panel-2); border: 1px solid var(--border);
           border-radius: 5px; overflow: hidden; }
  .cbar i { display: block; height: 100%; background: var(--accent);
            border-radius: 0 4px 4px 0; transition: width .6s cubic-bezier(.2,.7,.3,1); }
  .cval  { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 42px;
           text-align: right; }
  .cval.absent { font-size: 11px; font-weight: 500; letter-spacing: .02em; }
  .cbar.absent i { background: var(--text-dim); }
  .cname.absent, .cval.absent { color: var(--text-dim); }

  .detail { display: none; margin-top: 15px; padding-top: 14px; border-top: 1px solid var(--border); }
  .section.open .detail { display: block; }
  .drow { display: flex; justify-content: space-between; gap: 14px; padding: 5px 0; font-size: 13px; }
  .drow span:first-child { color: var(--text-dim); }
  .drow span:last-child { font-variant-numeric: tabular-nums; text-align: right; }
  .warn { margin-top: 10px; font-size: 12.5px; color: var(--yellow); line-height: 1.45;
          background: rgba(210,153,34,.1); border-radius: 7px; padding: 8px 10px; }
  .stale { color: var(--yellow); }

  .foot { margin-top: 22px; color: var(--text-dim); font-size: 12px;
          text-align: center; line-height: 1.7; }

  /* sign-in */
  .gate { max-width: 340px; margin: 12vh auto 0; padding: 0 20px; }
  .gate h2 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .gate p  { color: var(--text-dim); font-size: 13px; margin: 0 0 20px; }
  .gate input {
    width: 100%; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 11px 12px;
    font-size: 16px; font-family: inherit; margin-bottom: 10px;
  }
  .gate input:focus { outline: none; border-color: var(--accent); }
  .gate button { width: 100%; justify-content: center; padding: 12px; font-size: 15px; }
  .gate .err { color: var(--red); font-size: 12.5px; margin-top: 12px; min-height: 16px; }
  .linkbtn { background: none; border: 0; color: var(--accent-2); font: inherit; font-size: 12.5px;
             cursor: pointer; padding: 0; text-decoration: underline; width: auto; }

  /* account panel */
  /* Dark theme on a dark backdrop: .55 black over #0f1419 is almost no change at
     all, so a dialog read as part of the page rather than on top of it. Deeper
     scrim + a little blur, and the modal is a lifted surface, not a flat panel. */
  .veil { position: fixed; inset: 0; background: rgba(0,0,0,.68); z-index: 200;
          -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
          display: flex; align-items: flex-start; justify-content: center;
          padding: 20px; overflow-y: auto; }
  /* margin:auto centres it when there is room and simply scrolls when there is
     not — flex `align-items:center` would clip the top of a tall dialog on a
     short phone in landscape. */
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
           width: 100%; max-width: 380px; padding: 22px; margin: auto;
           box-shadow: 0 16px 40px rgba(0,0,0,.45); }
  .modal h3 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
  .modal .who2 { color: var(--text-dim); font-size: 12.5px; margin: 0 0 18px; }
  .modal label { display: block; font-size: 11px; color: var(--text-dim);
                 text-transform: uppercase; letter-spacing: .04em; margin: 0 0 4px; }
  .modal input { width: 100%; background: var(--bg); color: var(--text);
                 border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px;
                 font-size: 16px; font-family: inherit; margin-bottom: 12px; }
  .modal input:focus { outline: none; border-color: var(--accent); }
  .modal .msg { font-size: 12.5px; min-height: 17px; margin: 2px 0 12px; }
  .modal .msg.bad { color: var(--red); }
  .modal .msg.good { color: var(--green); }
  .modal .actions { display: flex; gap: 8px; }
  .modal .actions .btn { flex: 1; justify-content: center; }

  @media (max-width: 720px) {
    header { padding: 12px 14px; padding-top: max(12px, env(safe-area-inset-top)); }
    .header-inner { gap: 10px; }
    .header-title h1 { font-size: 16px; line-height: 1.2; margin-bottom: 2px; }
    .header-title p  { font-size: 11px; }
    .btn { padding: 9px 12px; font-size: 12px; min-height: 36px; border-radius: 7px; }
    main { padding: 14px 12px calc(40px + env(safe-area-inset-bottom)); }
    .section { padding: 14px 13px 13px; border-radius: 8px; margin-bottom: 11px; }
    .name { font-size: 15.5px; }
    .stat .v { font-size: 17px; }
    .chart { padding: 14px 13px 15px; border-radius: 8px; }
    .crows, .scopes { column-gap: 10px; }
    .cname, .sname { max-width: 40vw; }
  }
  @media (max-width: 380px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .stat.eta { grid-column: span 2; }
  }
</style>
</head>
<body>

<div id="app" hidden>
  <header>
    <div class="header-inner">
      <div class="header-title">
        <h1>Advanced Facade — Project Overview</h1>
        <p id="sub">Loading…</p>
      </div>
      <div class="header-actions">
        <button class="btn" type="button" id="acct" title="Account — change password"
                style="font-size:12px"><span id="me"></span></button>
        <button class="btn" type="button" id="theme" title="Day / night">☀️</button>
        <button class="btn" type="button" id="out">Sign out</button>
      </div>
    </div>
  </header>
  <main>
    <section class="chart" id="chart" hidden></section>
    <div id="list"></div>
    <p class="foot" id="foot"></p>
  </main>
</div>

<form class="gate" id="gate" hidden>
  <h2>Advanced Facade</h2>
  <p>Sign in to view the project overview.</p>
  <input type="email" id="email" placeholder="you@advfacade.com" autocomplete="email" required>
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
  <button class="btn btn-primary" type="submit" id="go">Sign in</button>
  <div class="err" id="err"></div>
  <button class="linkbtn" type="button" id="forgot" style="margin-top:14px">Forgot password</button>
</form>

<div class="veil" id="acctPanel" hidden>
  <form class="modal" id="pwForm">
    <h3>Change password</h3>
    <p class="who2" id="acctWho"></p>

    <label for="curPw">Current password</label>
    <input type="password" id="curPw" autocomplete="current-password" required>

    <label for="newPw">New password</label>
    <input type="password" id="newPw" autocomplete="new-password" minlength="8" required>

    <label for="newPw2">Confirm new password</label>
    <input type="password" id="newPw2" autocomplete="new-password" minlength="8" required>

    <div class="msg" id="pwMsg">At least 8 characters.</div>
    <div class="actions">
      <button class="btn" type="button" id="pwCancel">Cancel</button>
      <button class="btn btn-primary" type="submit" id="pwSave">Save</button>
    </div>
  </form>
</div>

<!-- Reset password. Deliberately NOT the dialog above: someone who has forgotten
     their password cannot type a current one, so the two flows never share a box. -->
<div class="veil" id="resetPanel" hidden>
  <form class="modal" id="resetForm">
    <h3>Reset password</h3>
    <p class="who2">We will email you a link to set a new one.</p>

    <label for="resetEmail">Email</label>
    <input type="email" id="resetEmail" placeholder="you@advfacade.com" autocomplete="email" required>

    <div class="msg" id="resetMsg">The link is good for one hour.</div>
    <div class="actions">
      <button class="btn" type="button" id="resetCancel">Cancel</button>
      <button class="btn btn-primary" type="submit" id="resetSend">Send link</button>
    </div>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="af-hub-config.js"></script>
<script>
/* ────────────────────────────────────────────────────────────────────────
   AF Hub — executive overview

   Contract, written to /projects/{id}/summary by hub-report.js in each
   tracker, and by the scheduled reporter in .github/workflows/report.yml :
     name, unit, scope, url, done, total,
     weekRate, prevWeekRate, avg4w, openDamage, pendingCO, ts

   This screen compares PERCENT and ESTIMATED COMPLETION, never raw counts —
   which is why projects measured in different units share one list.
   ──────────────────────────────────────────────────────────────────────── */

const DAY = 864e5;

/* The roster — every project that BELONGS here, reported or not. Live summaries
   merge on top; a project that has never pushed still gets a row, dimmed. The
   list must not be decided by whoever happened to write last.
   Add a row the same day you add hubId to a tracker's project-config.js. */
const ROSTER = [
  { id:'ac3', name:'Atlantic-Chestnut Building 3', unit:'openings',
    scope:'Storefront / Curtain Wall',
    url:'https://atlantic-chestnut-3-tracking.vercel.app' },
  { id:'cp2', name:'Cooper Park 2', unit:'openings',
    scope:'Storefront — GF 71 · L2 6 · L13 5', url:'' },
  { id:'lex', name:'355 Lexington Avenue', unit:'pieces',
    scope:'Shower Door 159 · Terrace Divider 33 · Guardrail 8 · Equipment Screen 2', url:'' },
];

function merge(live){
  const byId = new Map(ROSTER.map(r => [r.id, Object.assign({ reported:false }, r)]));
  Object.keys(live || {}).forEach(id => {
    const s = live[id] && live[id].summary;
    if (!s || !s.name) return;
    const base = byId.get(id) || { id, url:'' };
    // A reported url wins; an empty one must not wipe the roster fallback.
    const merged = Object.assign(base, s, { reported: !!s.ts });
    if (!s.url) merged.url = base.url || '';
    byId.set(id, merged);
  });
  return [...byId.values()];
}

/* The signed-in email, carried to a tracker on Open ↗ so its own sign-in box is
   already filled in. In the hash, not the query string: a fragment is never sent
   to the server and never lands in a referrer or a server log. */
let ME = '';

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = d => d.toLocaleDateString('en-US', { month:'short', day:'numeric' });

function eta(p){
  const remain = (p.total || 0) - (p.done || 0);
  if (!p.total)    return { text:'—',        cls:'none', days:null };
  if (remain <= 0) return { text:'Complete', cls:'',     days:0 };
  const perDay = (p.avg4w || 0) / 7;
  if (perDay <= 0) return { text:'No data',  cls:'none', days:null };
  const days = Math.ceil(remain / perDay);
  return { text: fmtDate(new Date(Date.now() + days*DAY)), cls: days > 270 ? 'late' : '', days };
}

/* Hand the tracker the email we are already signed in with. Fragment, not query —
   see the note on ME. The tracker strips it from the address bar once it has read it. */
function openUrl(url){
  if (!url || !ME) return url || '';
  return url.replace(/#.*$/, '') + '#u=' + encodeURIComponent(ME);
}

/* Per-scope rows (Leo, 2026-09-17): "he wants to know how many doors (ex, in,
   fire-rated) & storefronts (ex & in) left". The reporter sends the split; a
   tracker still on v4 sends nothing and the card simply has no scope section.
   Caulking and beauty cap are not here on purpose — crew workflow, not scope. */
function scopeRows(p){
  const bd = Array.isArray(p.breakdown) ? p.breakdown.filter(b => b && b.total) : [];
  if (bd.length < 2) return '';        // one bucket says nothing the headline has not
  return `<div class="scopes">` + bd.map(b => {
    const done = b.done || 0, total = b.total, left = total - done;
    const pc = Math.round(100 * done / total);
    return `<span class="sname" title="${esc(b.scope)}">${esc(b.scope)}</span>`
         + `<span class="sbar" title="${done} of ${total} installed"><i class="${left ? '' : 'done'}" style="width:${pc}%"></i></span>`
         + `<span class="sval">${left ? left : '✓'}<small>${left ? ' left' : ' done'}</small></span>`;
  }).join('') + `</div>`;
}

/* Completion by project. One measure across three named entities → horizontal bars,
   sorted, zero baseline, one hue. Not a categorical palette: these are not unrelated
   series, they are the same number measured three times. */
function renderChart(list){
  const box = document.getElementById('chart');
  const rows = list.map(p => ({
    name: p.name,
    reported: p.reported && !!p.total,
    pct: p.total ? Math.round(100 * (p.done||0) / p.total) : 0,
    done: p.done||0, total: p.total||0,
  })).sort((a,b) => (b.reported - a.reported) || (b.pct - a.pct));

  if (!rows.length) { box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = `<h2>Completion by project</h2><div class="crows">` + rows.map(r => {
    const off = r.reported ? '' : ' absent';
    return `<span class="cname${off}">${esc(r.name)}</span>`
         + `<span class="cbar${off}" title="${r.reported ? r.done + ' of ' + r.total + ' installed' : 'no report yet'}">`
         +   `<i style="width:${r.reported ? r.pct : 0}%"></i></span>`
         + `<span class="cval${off}">${r.reported ? r.pct + '%' : 'no report'}</span>`;
  }).join('') + `</div>`;
}

function card(p){
  const pct = p.total ? Math.round(100 * (p.done||0) / p.total) : 0;
  const e = eta(p);
  const dw = (p.weekRate||0) - (p.prevWeekRate||0);
  const arrow = !p.prevWeekRate ? '' : dw > 0 ? ` ▲${dw}` : dw < 0 ? ` ▼${Math.abs(dw)}` : '';
  const stale = p.ts && (Date.now() - p.ts > 2*DAY);

  const el = document.createElement('div');
  el.className = 'section' + (p.reported ? '' : ' offline');
  el.innerHTML = `
    <div class="row1">
      <div class="name">${esc(p.name)}</div>
      <div class="tag">${esc(p.unit || '')}</div>
      ${!p.reported ? `<div class="chip idle">not reporting</div>` : ''}
      ${p.openDamage ? `<div class="chip dmg">⚠ ${p.openDamage}</div>` : ''}
      ${p.pendingCO  ? `<div class="chip co">CO ${p.pendingCO}</div>`  : ''}
      ${p.url ? `<a class="btn open-btn" href="${esc(openUrl(p.url))}" target="_blank" rel="noopener"
                    title="Open the tracker">Open ↗</a>` : ''}
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="stats">
      <div class="stat"><div class="k">Progress</div>
        <div class="v">${pct}%<small>${p.done||0}${p.total ? '/'+p.total : ''}</small></div></div>
      <div class="stat"><div class="k">This week</div>
        <div class="v">${p.weekRate||0}<small>${arrow}</small></div></div>
      <div class="stat eta ${e.cls}"><div class="k">Est. complete</div>
        <div class="v">${e.text}</div></div>
    </div>
    ${scopeRows(p)}
    <div class="detail">
      <div class="drow"><span>Scope</span><span>${esc(p.scope || '—')}</span></div>
      <div class="drow"><span>Remaining</span><span>${p.total ? `${p.total - (p.done||0)} ${esc(p.unit||'')}` : '—'}</span></div>
      <div class="drow"><span>4-week average</span><span>${p.avg4w||0} ${esc(p.unit||'')} / wk</span></div>
      <div class="drow"><span>Last week</span><span>${p.prevWeekRate||0} ${esc(p.unit||'')}</span></div>
      <div class="drow"><span>Open damage / pending CO</span><span>${p.openDamage||0} / ${p.pendingCO||0}</span></div>
      <div class="drow"><span>Last report</span><span class="${stale?'stale':''}">${
        p.ts ? new Date(p.ts).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})
             : 'Never'}</span></div>
      ${!p.reported ? `<div class="warn">No report yet. The scheduled reporter fills this in `
        + `automatically; opening the tracker while signed in also reports within seconds.</div>` : ''}
    </div>`;
  el.addEventListener('click', ev => {
    if (ev.target.closest('a')) return;          // the Open button is not a toggle
    el.classList.toggle('open');
  });
  return el;
}

function render(list){
  document.getElementById('gate').hidden = true;
  document.getElementById('app').hidden  = false;

  renderChart(list);

  const wrap = document.getElementById('list');
  wrap.innerHTML = '';
  list.sort((a,b) => (b.reported - a.reported) || ((eta(a).days ?? 9e9) - (eta(b).days ?? 9e9)));
  list.forEach(p => wrap.appendChild(card(p)));

  const silent = list.filter(p => !p.reported).length;
  document.getElementById('sub').textContent =
    new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})
    + ` · ${list.length} project${list.length===1?'':'s'}`
    + (silent ? ` · ${silent} not reporting` : '');

  const noTotal = list.filter(p => p.reported && !p.total).map(p => p.name);
  document.getElementById('foot').innerHTML =
    (noTotal.length ? `<b>${esc(noTotal.join(' · '))}</b> — total unknown, completion date cannot be estimated<br>` : '')
    + 'Tap a project for detail';
}

function showGate(msg){
  document.getElementById('app').hidden  = true;
  document.getElementById('gate').hidden = false;
  /* The account dialog belongs to a session. Never let it outlive one, and never
     leave a typed password sitting in a field behind a sign-out. */
  document.getElementById('acctPanel').hidden = true;
  ['curPw','newPw','newPw2'].forEach(id => {
    const f = document.getElementById(id); if (f) f.value = '';
  });
  const err = document.getElementById('err');
  err.style.color = '';                  // the reset-sent notice turns this green
  err.textContent = msg || '';
}

/* theme — same affordance and default as the trackers (dark unless told otherwise) */
(function theme(){
  const KEY = 'af_hub_theme';
  let day = false;
  try { day = localStorage.getItem(KEY) === 'day'; } catch (e) {}
  const paint = () => {
    document.body.classList.toggle('day-mode', day);
    const b = document.getElementById('theme');
    if (b) b.textContent = day ? '🌙' : '☀️';
  };
  paint();
  document.getElementById('theme').addEventListener('click', () => {
    day = !day;
    try { localStorage.setItem(KEY, day ? 'day' : 'night'); } catch (e) {}
    paint();
  });
})();

(function boot(){
  const cfg = window.AF_HUB_FIREBASE;
  if (!cfg || typeof firebase === 'undefined') { render(merge(null)); return; }

  firebase.initializeApp(cfg);
  const auth = firebase.auth();
  let ref = null;

  auth.onAuthStateChanged(user => {
    if (!user || user.isAnonymous) {
      if (ref) { ref.off(); ref = null; }
      ME = '';
      document.getElementById('me').textContent = '';
      showGate();
      return;
    }
    ME = user.email || '';
    document.getElementById('me').textContent = ME;
    ref = firebase.database().ref('projects');
    ref.on('value', snap => render(merge(snap.val())), () => render(merge(null)));
  });

  document.getElementById('out').addEventListener('click', () => {
    document.getElementById('pw').value = '';
    auth.signOut();
  });

  /* ── Account: change password ──────────────────────────────────────────
     Firebase refuses updatePassword() on a session that has been open a
     while, so ask for the current password and reauthenticate first. That
     also means a borrowed unlocked laptop cannot change the password. */
  const panel  = document.getElementById('acctPanel');
  const pwMsg  = document.getElementById('pwMsg');
  const fields = ['curPw','newPw','newPw2'];

  function setMsg(text, kind){
    pwMsg.textContent = text;
    pwMsg.className = 'msg' + (kind ? ' ' + kind : '');
  }
  function closePanel(){
    fields.forEach(id => { document.getElementById(id).value = ''; });
    panel.hidden = true;
  }

  document.getElementById('acct').addEventListener('click', () => {
    const u = auth.currentUser;
    if (!u || u.isAnonymous) return;   // nothing to reauthenticate against
    document.getElementById('acctWho').textContent = u.email || '';
    setMsg('At least 8 characters.');
    panel.hidden = false;
    document.getElementById('curPw').focus();
  });

  document.getElementById('pwCancel').addEventListener('click', closePanel);
  panel.addEventListener('click', ev => { if (ev.target === panel) closePanel(); });
  document.addEventListener('keydown', ev => {
    if (ev.key !== 'Escape') return;
    if (!panel.hidden)      closePanel();
    else if (!reset.hidden) closeReset();
  });

  document.getElementById('pwForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    const u = auth.currentUser;
    if (!u) return;

    const cur  = document.getElementById('curPw').value;
    const next = document.getElementById('newPw').value;
    const two  = document.getElementById('newPw2').value;

    if (next !== two)       return setMsg('The two new passwords do not match.', 'bad');
    if (next.length < 8)    return setMsg('Use at least 8 characters.', 'bad');
    if (next === cur)       return setMsg('That is your current password.', 'bad');

    const btn = document.getElementById('pwSave');
    btn.disabled = true;
    setMsg('Saving…');
    try {
      const cred = firebase.auth.EmailAuthProvider.credential(u.email, cur);
      await u.reauthenticateWithCredential(cred);
      await u.updatePassword(next);
      setMsg('Password changed.', 'good');
      setTimeout(closePanel, 1200);
    } catch (e) {
      const c = String(e && e.code || '');
      setMsg(
        /wrong-password|invalid-credential|invalid-login/.test(c) ? 'Current password is wrong.'
        : /weak-password/.test(c)     ? 'Firebase rejected that as too weak — try a longer one.'
        : /requires-recent-login/.test(c) ? 'Session too old. Sign out, sign in, and try again.'
        : /too-many-requests/.test(c) ? 'Too many attempts — try again shortly.'
        : 'Could not change the password. Check your connection.', 'bad');
    }
    btn.disabled = false;
  });

  /* ── Forgot password ───────────────────────────────────────────────────
     Opens on click and only on click. Needs no signed-in user, which is the
     whole reason it is a separate dialog from the one above. */
  const reset    = document.getElementById('resetPanel');
  const resetMsg = document.getElementById('resetMsg');
  const forgotBtn = document.getElementById('forgot');

  function setResetMsg(text, kind){
    resetMsg.textContent = text;
    resetMsg.className = 'msg' + (kind ? ' ' + kind : '');
  }
  function closeReset(){
    reset.hidden = true;
    forgotBtn.focus();
  }

  forgotBtn.addEventListener('click', () => {
    const box = document.getElementById('resetEmail');
    box.value = document.getElementById('email').value.trim();
    setResetMsg('The link is good for one hour.');
    document.getElementById('resetSend').disabled = false;
    reset.hidden = false;
    box.focus();
    if (box.value) box.select();
  });

  document.getElementById('resetCancel').addEventListener('click', closeReset);
  reset.addEventListener('click', ev => { if (ev.target === reset) closeReset(); });

  document.getElementById('resetForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    const email = document.getElementById('resetEmail').value.trim();
    if (!email) return setResetMsg('Enter your email address.', 'bad');

    const btn = document.getElementById('resetSend');
    btn.disabled = true;
    setResetMsg('Sending…');
    try {
      await auth.sendPasswordResetEmail(email);
      setResetMsg('Link sent to ' + email + '. It arrives from firebaseapp.com — '
                + 'check spam the first time.', 'good');
      setTimeout(closeReset, 3000);
    } catch (e) {
      const c = String(e && e.code || '');
      setResetMsg(
        /user-not-found/.test(c)      ? 'No account with that email.'
        : /invalid-email/.test(c)     ? 'That is not a valid email address.'
        : /too-many-requests/.test(c) ? 'Too many attempts — try again shortly.'
        : 'Could not send the reset email. Check your connection.', 'bad');
      btn.disabled = false;
    }
  });

  document.getElementById('gate').addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = document.getElementById('go');
    btn.disabled = true;
    document.getElementById('err').textContent = '';
    try {
      await auth.signInWithEmailAndPassword(
        document.getElementById('email').value.trim(),
        document.getElementById('pw').value);
    } catch (e) {
      const c = String(e && e.code || '');
      showGate(/user-not-found|wrong-password|invalid-credential|invalid-login/.test(c)
        ? 'Wrong email or password.'
        : /too-many-requests/.test(c) ? 'Too many attempts — try again shortly.'
        : 'Could not sign in. Check your connection.');
    }
    btn.disabled = false;
  });
})();
</script>
