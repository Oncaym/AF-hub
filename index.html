<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Advanced Facade — Project Overview</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1117'/%3E%3Cpath d='M14 46V18h12v28zM32 46V26h18v20z' fill='%2358a6ff'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel-2:#1c2129; --line:#30363d;
    --text:#e6edf3; --dim:#8b949e; --faint:#6e7681;
    --blue:#58a6ff; --green:#3fb950; --amber:#d29922; --red:#f85149; --purple:#a371f7;
    --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#ffffff; --panel:#f6f8fa; --panel-2:#eef1f4; --line:#d0d7de;
      --text:#1f2328; --dim:#636c76; --faint:#8c959f;
      --blue:#0969da; --green:#1a7f37; --amber:#9a6700; --red:#cf222e; --purple:#8250df;
    }
  }
  :root[data-theme="light"]{
    --bg:#ffffff; --panel:#f6f8fa; --panel-2:#eef1f4; --line:#d0d7de;
    --text:#1f2328; --dim:#636c76; --faint:#8c959f;
    --blue:#0969da; --green:#1a7f37; --amber:#9a6700; --red:#cf222e; --purple:#8250df;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background:var(--bg); color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 28px);
    max-width:900px; margin:0 auto;
    -webkit-font-smoothing:antialiased;
  }
  h1{font-size:20px; font-weight:650; letter-spacing:-.01em; margin:0}
  .sub{color:var(--dim); font-size:12.5px; margin:4px 0 18px; display:flex; gap:8px;
       align-items:center; flex-wrap:wrap}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--faint);display:inline-block}
  .seedmode{color:var(--amber)}

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:15px 16px 14px; margin-bottom:11px; cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .card:active{background:var(--panel-2)}
  .card.open{border-color:var(--blue)}

  .row1{display:flex; align-items:center; gap:9px; margin-bottom:11px}
  .name{font-size:16.5px; font-weight:620; letter-spacing:-.01em; flex:1; min-width:0;
        overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .tag{font-size:10.5px; color:var(--dim); border:1px solid var(--line); border-radius:5px;
       padding:2px 6px; white-space:nowrap; flex:none}
  .flags{display:flex; gap:5px; flex:none}
  .flag{font-size:11px; font-weight:640; border-radius:5px; padding:2.5px 7px; white-space:nowrap}
  .flag.dmg{background:color-mix(in srgb, var(--red) 16%, transparent); color:var(--red)}
  .flag.co{background:color-mix(in srgb, var(--purple) 16%, transparent); color:var(--purple)}

  .bar{height:7px; background:var(--panel-2); border-radius:4px; overflow:hidden; margin-bottom:10px;
       border:1px solid color-mix(in srgb, var(--line) 60%, transparent)}
  .bar i{display:block; height:100%; border-radius:4px; background:var(--blue);
         transition:width .5s cubic-bezier(.2,.7,.3,1)}

  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
  .stat .k{font-size:10.5px; color:var(--faint); letter-spacing:.03em;
           text-transform:uppercase; margin-bottom:2px}
  .stat .v{font-size:16px; font-weight:640; letter-spacing:-.01em; font-variant-numeric:tabular-nums}
  .stat .v small{font-size:11.5px; font-weight:500; color:var(--dim); margin-left:3px}
  .stat.eta .v{color:var(--blue)}
  .stat.eta.late .v{color:var(--amber)}
  .stat.eta.none .v{color:var(--faint); font-size:14px}

  .detail{display:none; margin-top:14px; padding-top:13px; border-top:1px solid var(--line)}
  .card.open .detail{display:block}
  .drow{display:flex; justify-content:space-between; gap:12px; padding:5px 0; font-size:13px}
  .drow span:first-child{color:var(--dim)}
  .drow span:last-child{font-variant-numeric:tabular-nums; text-align:right}
  .warn{margin-top:9px; font-size:12px; color:var(--amber); line-height:1.45;
        background:color-mix(in srgb, var(--amber) 11%, transparent);
        border-radius:7px; padding:7px 9px}

  .foot{margin-top:20px; color:var(--faint); font-size:11.5px; text-align:center; line-height:1.7}
  .foot b{color:var(--dim); font-weight:600}
  .stale{color:var(--amber)}

  /* sign-in */
  .gate{max-width:320px; margin:14vh auto 0}
  .gate h2{font-size:17px; font-weight:620; margin:0 0 4px}
  .gate p{color:var(--dim); font-size:13px; margin:0 0 18px}
  .gate input{
    width:100%; background:var(--panel); color:var(--text);
    border:1px solid var(--line); border-radius:9px; padding:11px 12px;
    font-size:16px; margin-bottom:9px; font-family:inherit;
  }
  .gate input:focus{outline:none; border-color:var(--blue)}
  .gate button{
    width:100%; background:var(--blue); color:#fff; border:0; border-radius:9px;
    padding:12px; font-size:15px; font-weight:620; font-family:inherit; cursor:pointer;
  }
  .gate button:disabled{opacity:.5}
  .gate .err{color:var(--red); font-size:12.5px; margin-top:10px; min-height:16px}

  @media (max-width:360px){ .stats{grid-template-columns:repeat(2,1fr)} .stat.eta{grid-column:span 2} }
</style>
</head>
<body>

<div id="app" hidden>
  <h1>Project Overview</h1>
  <p class="sub" id="sub">Loading…</p>
  <div id="list"></div>
  <p class="foot" id="foot"></p>
</div>

<form class="gate" id="gate" hidden>
  <h2>Advanced Facade</h2>
  <p>Sign in to view the project overview.</p>
  <input type="email" id="email" placeholder="you@advfacade.com" autocomplete="email" required>
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
  <button type="submit" id="go">Sign in</button>
  <div class="err" id="err"></div>
</form>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="af-hub-config.js"></script>
<script>
/* ────────────────────────────────────────────────────────────────────────
   AF Hub — executive overview (MVP)

   Contract, written by every tracker to /projects/{id}/summary :
     name, unit, scope, done, total,
     weekRate, prevWeekRate, avg4w, openDamage, pendingCO, ts

   This screen compares PERCENT and ESTIMATED COMPLETION, never raw counts —
   which is why projects measured in different units can share one list.
   ──────────────────────────────────────────────────────────────────────── */

const DAY = 864e5;

/* Fallback shown before the trackers are wired up. Totals come from each
   project's project-config.js seedUnits (counted 2026-09-17). */
const SEED = [
  { id:'ac3', name:'Atlantic Chestnut 3', unit:'openings', scope:'Storefront / Curtain Wall',
    done:0, total:null, weekRate:0, prevWeekRate:0, avg4w:0, openDamage:0, pendingCO:0, ts:0,
    note:'Total pending — the local seed holds only 17 units while the ground-floor plan alone '
       + 'carries 70+ markers. The real count arrives automatically once hub-report.js is wired in.' },
  { id:'cp2', name:'Cooper Park 2', unit:'openings', scope:'Storefront — GF 71 · L2 6 · L13 5',
    done:0, total:82, weekRate:0, prevWeekRate:0, avg4w:0, openDamage:0, pendingCO:0, ts:0 },
  { id:'lex', name:'355 Lexington', unit:'pieces',
    scope:'Shower Door 159 · Terrace Divider 33 · Guardrail 8 · Equipment Screen 2',
    done:0, total:232, weekRate:0, prevWeekRate:0, avg4w:0, openDamage:0, pendingCO:0, ts:0 },
];

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = d => d.toLocaleDateString('en-US', { month:'short', day:'numeric' });

function eta(p){
  const remain = (p.total || 0) - (p.done || 0);
  if (!p.total)   return { text:'—',     cls:'none', days:null };
  if (remain <= 0) return { text:'Complete', cls:'', days:0 };
  const perDay = (p.avg4w || 0) / 7;              // avg4w = mean weekly output, last 4 weeks
  if (perDay <= 0) return { text:'No data', cls:'none', days:null };
  const days = Math.ceil(remain / perDay);
  return { text:fmtDate(new Date(Date.now() + days*DAY)), cls: days > 270 ? 'late' : '', days };
}

function card(p){
  const pct = p.total ? Math.round(100 * (p.done||0) / p.total) : 0;
  const e = eta(p);
  const dw = (p.weekRate||0) - (p.prevWeekRate||0);
  const arrow = !p.prevWeekRate ? '' : dw > 0 ? ` ▲${dw}` : dw < 0 ? ` ▼${Math.abs(dw)}` : '';
  const stale = p.ts && (Date.now() - p.ts > 2*DAY);

  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="row1">
      <div class="name">${esc(p.name)}</div>
      <div class="tag">${esc(p.unit || '')}</div>
      <div class="flags">
        ${p.openDamage ? `<div class="flag dmg">⚠ ${p.openDamage}</div>` : ''}
        ${p.pendingCO  ? `<div class="flag co">CO ${p.pendingCO}</div>`  : ''}
      </div>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="stats">
      <div class="stat"><div class="k">Progress</div>
        <div class="v">${pct}%<small>${p.done||0}${p.total ? '/'+p.total : ''}</small></div></div>
      <div class="stat"><div class="k">This week</div>
        <div class="v">${p.weekRate||0}<small>${arrow}</small></div></div>
      <div class="stat eta ${e.cls}"><div class="k">Est. complete</div>
        <div class="v">${e.text}</div></div>
    </div>
    <div class="detail">
      <div class="drow"><span>Scope</span><span>${esc(p.scope || '—')}</span></div>
      <div class="drow"><span>Remaining</span><span>${p.total ? `${p.total - (p.done||0)} ${esc(p.unit||'')}` : '—'}</span></div>
      <div class="drow"><span>4-week average</span><span>${p.avg4w||0} ${esc(p.unit||'')} / wk</span></div>
      <div class="drow"><span>Last week</span><span>${p.prevWeekRate||0} ${esc(p.unit||'')}</span></div>
      <div class="drow"><span>Open damage / pending CO</span><span>${p.openDamage||0} / ${p.pendingCO||0}</span></div>
      <div class="drow"><span>Last report</span><span class="${stale?'stale':''}">${
        p.ts ? new Date(p.ts).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})
             : 'Not connected'}</span></div>
      ${p.note ? `<div class="warn">${esc(p.note)}</div>` : ''}
    </div>`;
  el.onclick = () => el.classList.toggle('open');
  return el;
}

function render(list, live){
  document.getElementById('gate').hidden = true;
  document.getElementById('app').hidden  = false;

  const wrap = document.getElementById('list');
  wrap.innerHTML = '';
  list.sort((a,b) => (eta(a).days ?? 9e9) - (eta(b).days ?? 9e9));
  list.forEach(p => wrap.appendChild(card(p)));

  document.getElementById('sub').innerHTML =
    `${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}`
    + ` <span class="dot"></span> ${list.length} project${list.length===1?'':'s'}`
    + (live ? '' : ' <span class="dot"></span> <span class="seedmode">not connected — showing seed data</span>');

  const noTotal = list.filter(p => !p.total).map(p => p.name);
  document.getElementById('foot').innerHTML =
    (noTotal.length ? `<b>${esc(noTotal.join(' · '))}</b> — total unknown, completion date cannot be estimated<br>` : '')
    + 'Tap any row for detail';
}

function showGate(msg){
  document.getElementById('app').hidden  = true;
  document.getElementById('gate').hidden = false;
  document.getElementById('err').textContent = msg || '';
}

(function boot(){
  const cfg = window.AF_HUB_FIREBASE;
  if (!cfg || typeof firebase === 'undefined') { render(SEED.slice(), false); return; }

  firebase.initializeApp(cfg);
  const auth = firebase.auth();

  auth.onAuthStateChanged(user => {
    // Trackers push anonymously; the overview itself requires a real account.
    if (!user || user.isAnonymous) { showGate(); return; }
    firebase.database().ref('projects').on('value', snap => {
      const v = snap.val() || {};
      const list = Object.keys(v)
        .map(k => Object.assign({ id:k }, v[k] && v[k].summary))
        .filter(p => p.name);
      render(list.length ? list : SEED.slice(), list.length > 0);
    }, () => render(SEED.slice(), false));
  });

  document.getElementById('gate').addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = document.getElementById('go');
    btn.disabled = true;
    document.getElementById('err').textContent = '';
    try {
      await auth.signInWithEmailAndPassword(
        document.getElementById('email').value.trim(),
        document.getElementById('pw').value);
    } catch (e) {
      const c = String(e && e.code || '');
      showGate(/user-not-found|wrong-password|invalid-credential|invalid-login/.test(c)
        ? 'Wrong email or password.'
        : /too-many-requests/.test(c) ? 'Too many attempts — try again shortly.'
        : 'Could not sign in. Check your connection.');
    }
    btn.disabled = false;
  });
})();
</script>
</body>
</html>
