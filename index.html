<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Advanced Facade — 项目总览</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1117'/%3E%3Cpath d='M14 46V18h12v28zM32 46V26h18v20z' fill='%2358a6ff'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel-2:#1c2129; --line:#30363d;
    --text:#e6edf3; --dim:#8b949e; --faint:#6e7681;
    --blue:#58a6ff; --green:#3fb950; --amber:#d29922; --red:#f85149; --purple:#a371f7;
    --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#ffffff; --panel:#f6f8fa; --panel-2:#eef1f4; --line:#d0d7de;
      --text:#1f2328; --dim:#636c76; --faint:#8c959f;
      --blue:#0969da; --green:#1a7f37; --amber:#9a6700; --red:#cf222e; --purple:#8250df;
    }
  }
  :root[data-theme="light"]{
    --bg:#ffffff; --panel:#f6f8fa; --panel-2:#eef1f4; --line:#d0d7de;
    --text:#1f2328; --dim:#636c76; --faint:#8c959f;
    --blue:#0969da; --green:#1a7f37; --amber:#9a6700; --red:#cf222e; --purple:#8250df;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background:var(--bg); color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI",system-ui,sans-serif;
    padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 28px);
    max-width:900px; margin:0 auto;
    -webkit-font-smoothing:antialiased;
  }
  .top{display:flex; align-items:baseline; gap:10px; margin-bottom:4px}
  h1{font-size:20px; font-weight:650; letter-spacing:-.01em; margin:0}
  .sub{color:var(--dim); font-size:12.5px; margin:0 0 18px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--faint);display:inline-block}

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:15px 16px 14px; margin-bottom:11px; cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .card:active{background:var(--panel-2)}
  .card.open{border-color:var(--blue)}

  .row1{display:flex; align-items:center; gap:9px; margin-bottom:11px}
  .name{font-size:16.5px; font-weight:620; letter-spacing:-.01em; flex:1; min-width:0;
        overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .tag{font-size:10.5px; color:var(--dim); border:1px solid var(--line); border-radius:5px;
       padding:2px 6px; white-space:nowrap; flex:none}
  .flags{display:flex; gap:5px; flex:none}
  .flag{font-size:11px; font-weight:640; border-radius:5px; padding:2.5px 7px; white-space:nowrap}
  .flag.dmg{background:color-mix(in srgb, var(--red) 16%, transparent); color:var(--red)}
  .flag.co{background:color-mix(in srgb, var(--purple) 16%, transparent); color:var(--purple)}

  .bar{height:7px; background:var(--panel-2); border-radius:4px; overflow:hidden; margin-bottom:10px;
       border:1px solid color-mix(in srgb, var(--line) 60%, transparent)}
  .bar i{display:block; height:100%; border-radius:4px; background:var(--blue);
         transition:width .5s cubic-bezier(.2,.7,.3,1)}

  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
  .stat .k{font-size:10.5px; color:var(--faint); letter-spacing:.02em; margin-bottom:2px}
  .stat .v{font-size:16px; font-weight:640; letter-spacing:-.01em; font-variant-numeric:tabular-nums}
  .stat .v small{font-size:11.5px; font-weight:500; color:var(--dim); margin-left:2px}
  .stat.eta .v{color:var(--blue)}
  .stat.eta.late .v{color:var(--amber)}
  .stat.eta.none .v{color:var(--faint); font-size:14px}

  .detail{display:none; margin-top:14px; padding-top:13px; border-top:1px solid var(--line)}
  .card.open .detail{display:block}
  .drow{display:flex; justify-content:space-between; gap:12px; padding:5px 0; font-size:13px}
  .drow span:first-child{color:var(--dim)}
  .drow span:last-child{font-variant-numeric:tabular-nums}
  .warn{margin-top:9px; font-size:12px; color:var(--amber);
        background:color-mix(in srgb, var(--amber) 11%, transparent);
        border-radius:7px; padding:7px 9px; line-height:1.4}

  .foot{margin-top:20px; color:var(--faint); font-size:11.5px; text-align:center; line-height:1.7}
  .foot b{color:var(--dim); font-weight:600}
  .stale{color:var(--amber)}
  @media (max-width:360px){ .stats{grid-template-columns:repeat(2,1fr)} .stat.eta{grid-column:span 2} }
</style>
</head>
<body>

<div class="top"><h1>项目总览</h1></div>
<p class="sub" id="sub">载入中…</p>

<div id="list"></div>

<p class="foot" id="foot"></p>

<script>
/* ────────────────────────────────────────────────────────────────
   AF Hub — 老板屏 MVP
   数据契约(每个 tracker 上报到 /projects/{id}/summary):
     name, unit, done, total, weekRate, prevWeekRate, avg4w,
     openDamage, pendingCO, ts
   老板屏比的是 % 和预计完工日,不是绝对数量 —— 所以单位不同也能同屏排。
   ──────────────────────────────────────────────────────────────── */

// 还没接 Firebase 时用的种子(数字来自三个 tracker 的 project-config.js)
const SEED = [
  { id:'ac3', name:'Atlantic Chestnut 3', unit:'樘', scope:'Storefront / CW',
    done:0, total:null, weekRate:0, prevWeekRate:0, avg4w:0, openDamage:0, pendingCO:0, ts:0,
    note:'总数待从云端确认 —— 种子只有 17 条,平面图上 GF 就有 70+ 个 marker' },
  { id:'cp2', name:'Cooper Park 2', unit:'樘', scope:'Storefront',
    done:0, total:82, weekRate:0, prevWeekRate:0, avg4w:0, openDamage:0, pendingCO:0, ts:0 },
  { id:'lex', name:'355 Lexington', unit:'件', scope:'Shower Door 159 · Divider 33 · Guardrail 8 · Screen 2',
    done:0, total:232, weekRate:0, prevWeekRate:0, avg4w:0, openDamage:0, pendingCO:0, ts:0 },
];

const fmtDate = d => `${d.getMonth()+1}/${String(d.getDate()).padStart(2,'0')}`;
const DAY = 864e5;

function eta(p){
  const remain = (p.total||0) - (p.done||0);
  if (!p.total) return { text:'—', cls:'none', days:null };
  if (remain <= 0) return { text:'已完成', cls:'', days:0 };
  const perDay = (p.avg4w||0) / 7;                    // avg4w = 近四周平均周产量
  if (perDay <= 0) return { text:'待数据', cls:'none', days:null };
  const days = Math.ceil(remain / perDay);
  return { text:fmtDate(new Date(Date.now()+days*DAY)), cls: days>270?'late':'', days };
}

function card(p){
  const pct = p.total ? Math.round(100*(p.done||0)/p.total) : 0;
  const e = eta(p);
  const dw = (p.weekRate||0) - (p.prevWeekRate||0);
  const arrow = !p.prevWeekRate ? '' : dw>0 ? ' ▲'+dw : dw<0 ? ' ▼'+Math.abs(dw) : '';
  const stale = p.ts && (Date.now()-p.ts > 2*DAY);

  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="row1">
      <div class="name">${esc(p.name)}</div>
      <div class="tag">${esc(p.unit||'')}</div>
      <div class="flags">
        ${p.openDamage ? `<div class="flag dmg">⚠ ${p.openDamage}</div>` : ''}
        ${p.pendingCO  ? `<div class="flag co">CO ${p.pendingCO}</div>`  : ''}
      </div>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="stats">
      <div class="stat"><div class="k">进度</div>
        <div class="v">${pct}%<small>${p.done||0}${p.total?'/'+p.total:''}</small></div></div>
      <div class="stat"><div class="k">本周</div>
        <div class="v">${p.weekRate||0}<small>${esc(p.unit||'')}${arrow}</small></div></div>
      <div class="stat eta ${e.cls}"><div class="k">预计完工</div>
        <div class="v">${e.text}</div></div>
    </div>
    <div class="detail">
      <div class="drow"><span>Scope</span><span>${esc(p.scope||'—')}</span></div>
      <div class="drow"><span>剩余</span><span>${p.total?((p.total-(p.done||0))+' '+(p.unit||'')):'—'}</span></div>
      <div class="drow"><span>近四周均速</span><span>${p.avg4w||0} ${esc(p.unit||'')}/周</span></div>
      <div class="drow"><span>上周</span><span>${p.prevWeekRate||0} ${esc(p.unit||'')}</span></div>
      <div class="drow"><span>未决损坏 / 待批 CO</span><span>${p.openDamage||0} / ${p.pendingCO||0}</span></div>
      <div class="drow"><span>最后上报</span><span class="${stale?'stale':''}">${p.ts?new Date(p.ts).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'未接入'}</span></div>
      ${p.note ? `<div class="warn">${esc(p.note)}</div>` : ''}
    </div>`;
  el.onclick = () => el.classList.toggle('open');
  return el;
}

function esc(s){ return String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(list, live){
  const wrap = document.getElementById('list');
  wrap.innerHTML = '';
  list.sort((a,b) => (eta(a).days ?? 9e9) - (eta(b).days ?? 9e9));
  list.forEach(p => wrap.appendChild(card(p)));

  const d = new Date();
  document.getElementById('sub').innerHTML =
    `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 <span class="dot"></span> ${list.length} 个项目`
    + (live ? '' : ' <span class="dot"></span> <span class="stale">未接 Hub,显示种子数据</span>');

  const noTotal = list.filter(p => !p.total).map(p => p.name);
  document.getElementById('foot').innerHTML =
    (noTotal.length ? `<b>${noTotal.join(' · ')}</b> 缺总数,完工日无法计算<br>` : '')
    + '点任意一行展开细节';
}

/* 接 Firebase:填好 firebase-config.js 后自动切到实时数据 */
(function boot(){
  const cfg = window.AF_HUB_FIREBASE;
  if (!cfg || !window.firebase) { render(SEED.slice(), false); return; }
  try {
    firebase.initializeApp(cfg);
    firebase.auth().onAuthStateChanged(u => {
      if (!u) { firebase.auth().signInAnonymously().catch(()=>{}); return; }
      firebase.database().ref('projects').on('value', snap => {
        const v = snap.val() || {};
        const list = Object.keys(v).map(k => Object.assign({id:k}, v[k].summary || {}));
        render(list.length ? list : SEED.slice(), list.length > 0);
      }, () => render(SEED.slice(), false));
    });
  } catch(e){ render(SEED.slice(), false); }
})();
</script>
</body>
</html>
