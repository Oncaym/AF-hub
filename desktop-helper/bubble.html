<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
  #b { position: absolute; inset: 6px; border-radius: 50%; background: #0f1419 url(icon.png) center / 70% no-repeat;
       box-shadow: 0 2px 10px rgba(0,0,0,.45); border: 2px solid #4493f8; cursor: pointer; }
  #b:hover { border-color: #58a6ff; }
  #n { position: absolute; top: 0; right: 0; min-width: 22px; height: 22px; padding: 0 5px; box-sizing: border-box;
       border-radius: 11px; background: #f85149; color: #fff; font: 700 12px/22px "Segoe UI", sans-serif; text-align: center; display: none; }
</style></head>
<body><div id="b" title="AF Helper — click to open, drag to move, right-click for options"></div><div id="n"></div>
<script src="bubble.js"></script>
</body></html>
