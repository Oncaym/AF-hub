<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AF Helper</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1419'/%3E%3Cpath d='M16 48l6-2 24-24-4-4-24 24z' fill='%234493f8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../design/design.css?v=20261015a">
<link rel="stylesheet" href="assistant.css?v=20261015a">
</head>
<body class="assistant">
<header class="top">
  <div class="brand">✏️ AF Helper</div>
  <span class="grow"></span>
  <span class="who" id="who"></span>
  <a class="btn small ghost" href="../design/" target="_blank" rel="noopener" title="Design Board (full page)">Board</a>
  <button class="btn small ghost" id="newChat" title="Start a new conversation">New</button>
  <button class="btn small ghost" id="themeBtn" title="Light / dark">🌓</button>
</header>

<div id="gate" class="gate"><div class="box"><div class="dim">Loading…</div></div></div>

<main id="app" hidden>
  <section id="chat" class="chat" aria-live="polite"></section>
  <form id="composer" class="composer">
    <div id="atts" class="atts"></div>
    <div class="row">
      <label class="btn ghost attach" title="Attach pictures, PDF or Excel (or paste with Ctrl+V)">📎<input type="file" id="fileIn" multiple hidden accept="image/*,application/pdf,.xlsx,.xls,.csv"></label>
      <textarea id="msg" rows="1" placeholder="Ask or tell me anything — e.g. AC3 还剩哪些意见没改？ / SF11A installed today / paste a Discord screenshot"></textarea>
      <button class="btn primary" id="send" type="submit">Send</button>
    </div>
  </form>
</main>

<div id="modal" class="veil" hidden><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="../design/firebase-config.js?v=20261015a"></script>
<script src="../design/design-cloud.js?v=20261015a"></script>
<script src="projects.js?v=20261015a"></script>
<script src="assistant.js?v=20261015a"></script>
</body>
</html>
