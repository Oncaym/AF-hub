# v2 database rules — run the rules tests against the Firebase emulator on every
# change to the rules or the tests. Publishing the rules stays a manual step
# (Firebase console → Realtime Database → Rules), done only after this is green.
name: v2 rules tests

on:
  push:
    paths:
      - 'firebase-database-rules.json'
      - 'v2/tests/**'
      - '.github/workflows/v2-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: v2/tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm test
