# AF Hub — scheduled report.
# Every hour, read each tracker's cloud /state and write the same summary
# the browser reporter would, so the hub is current even when nobody has opened
# a tracker. Code: report/fetch-configs.js (step 1) and report/report.js (step 2).

name: Hub report

on:
  schedule:
    - cron: '17 * * * *'     # hourly at :17 (UTC). GitHub often starts it 10–15 min late — normal.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: compute and compare with the hub, write nothing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hub-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Runs each tracker's own project-config.js / elevations.js, fetched from its
      # live site. No secrets in this step, on purpose.
      - name: Fetch tracker configs
        run: node report/fetch-configs.js

      - name: Install firebase-admin
        working-directory: report
        run: npm install --omit=dev --no-audit --no-fund

      - name: Report to hub
        run: node report/report.js
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          HUB_SERVICE_ACCOUNT: ${{ secrets.HUB_SERVICE_ACCOUNT }}
          HUB_DATABASE_URL: ${{ secrets.HUB_DATABASE_URL }}
          AC3_SERVICE_ACCOUNT: ${{ secrets.AC3_SERVICE_ACCOUNT }}
          CP2_SERVICE_ACCOUNT: ${{ secrets.CP2_SERVICE_ACCOUNT }}
          LEX_SERVICE_ACCOUNT: ${{ secrets.LEX_SERVICE_ACCOUNT }}
