# AF Helper — the Windows desktop helper, Leona (desktop-helper/).
#   Every push that touches it: smoke test (Linux) + build the installer (Windows),
#   kept as a run artifact.
#   Run by hand (Actions → AF Helper → Run workflow): the same, and the installer is
#   published as a GitHub release, so the team downloads it from a plain link:
#     https://github.com/<owner>/<repo>/releases/latest  →  AF-Helper-Setup-<version>.exe
#   Bump "version" in desktop-helper/package.json for a new release.
#   Installed helpers update themselves from the newest release: they read
#   releases/latest/download/latest.yml, so every release carries latest.yml
#   next to the installer and is marked "latest". Releases of this repo are
#   only AF Helper releases.
#   The helper shows the hub page /assistant/, so most changes need no new
#   installer at all — only changes to desktop-helper/ do.
name: AF Helper

on:
  push:
    paths:
      - 'desktop-helper/**'
      - '.github/workflows/desktop-helper.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: af-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        working-directory: desktop-helper
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.55.0
      - name: Smoke test (Leona, panel, badge, busy, walking, links, origin check)
        working-directory: desktop-helper
        run: xvfb-run -a node test/smoke.mjs

  build:
    needs: smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        working-directory: desktop-helper
        run: npm install --no-audit --no-fund
      - name: Build the installer
        working-directory: desktop-helper
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: AF-Helper-Setup
          path: |
            desktop-helper/dist/*.exe
            desktop-helper/dist/latest.yml
      - name: Publish as a release (download link for the team)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./desktop-helper/package.json').version")
          T="af-helper-v$V"
          test -f desktop-helper/dist/latest.yml
          gh release view "$T" >/dev/null 2>&1 || gh release create "$T" --latest --title "AF Helper $V" \
            --notes "AF Helper (Leona). First time: download AF-Helper-Setup-$V.exe and double-click it (installs for you only, no admin). If Windows says 'Windows protected your PC', click More info → Run anyway. Already installed (0.2.0 or later): it updates itself."
          gh release upload "$T" "desktop-helper/dist/AF-Helper-Setup-$V.exe" "desktop-helper/dist/latest.yml" --clobber
          gh release edit "$T" --latest
